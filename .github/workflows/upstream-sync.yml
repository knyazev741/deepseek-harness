# Upstream sync: pull every change from deepseek-ai/deepseek-harness master
# into this fork as a reviewable PR.
#
# - Runs hourly (and on manual dispatch).
# - Creates/updates branch `sync/upstream-master` = upstream master rebased
#   onto our master; on conflict OUR (fork) version wins (`-X ours`), so the
#   fork's own changes are never silently overwritten by upstream.
# - Opens (or updates) a PR sync/upstream-master -> master. The companion
#   workflow `upstream-review.yml` reviews that PR with an LLM and merges it
#   only when the review and the sanity gates approve.
#
# No deployment is ever performed by this automation.

name: upstream-sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master

      - name: Count new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count master..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream commits not yet in this fork: $BEHIND"

      - name: Rebuild the sync branch (conflicts resolve in our favor)
        if: steps.check.outputs.behind != '0'
        run: |
          git config user.name 'dsh-sync[bot]'
          git config user.email 'dsh-sync[bot]@users.noreply.github.com'
          git checkout -B sync/upstream-master upstream/master
          # Replay upstream commits on top of our master; -X ours keeps the
          # fork's version of any hunk that conflicts with fork changes.
          git rebase -X ours master
          git push -f origin sync/upstream-master

      - name: Open or update the sync PR
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="Automated sync of upstream \`deepseek-ai/deepseek-harness\` master into this fork.

- Head: \`sync/upstream-master\` (upstream master rebased onto fork master; conflicting hunks resolved in the fork's favor).
- Reviewed by \`upstream-review.yml\` (LLM verdict + sanity gates) before any auto-merge.
- Review the diff, then merge when it looks safe — or let the review workflow merge it automatically.
- Deploys are never performed by this automation."
          PR=$(gh pr list --head sync/upstream-master --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base master --head sync/upstream-master \
              --title 'chore(sync): merge upstream changes' --body "$BODY"
          else
            gh pr edit "$PR" --body "$BODY"
          fi
