# Upstream sync: pull every change from deepseek-ai/deepseek-harness master
# into this fork as a reviewable PR.
#
# - Runs hourly (and on manual dispatch).
# - Creates/updates branch `sync/upstream-master` = upstream master rebased
#   onto our master; on conflict OUR (fork) version wins, so the fork's own
#   changes are never silently overwritten by upstream.
# - The rebase runs non-interactively: `-X ours` covers content conflicts,
#   `--empty=drop` skips commits that become empty, and modify/delete +
#   rename/delete conflicts (which `-X ours` cannot auto-resolve) are also
#   resolved in the fork's favor: keep the fork's file when it still exists,
#   keep the deletion when the fork removed it.
# - Opens (or updates) a PR sync/upstream-master -> master. The companion
#   workflow `upstream-review.yml` reviews that PR with an LLM and merges it
#   only when the review and the sanity gates approve.
#
# No deployment is ever performed by this automation.

name: upstream-sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master

      - name: Count new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count master..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream commits not yet in this fork: $BEHIND"

      - name: Rebuild the sync branch (conflicts resolve in our favor)
        if: steps.check.outputs.behind != '0'
        run: |
          set -euo pipefail
          git config user.name 'dsh-sync[bot]'
          git config user.email 'dsh-sync[bot]@users.noreply.github.com'
          git checkout -B sync/upstream-master upstream/master
          # Replay upstream commits on top of our master. -X ours keeps the
          # fork's version of any hunk that conflicts with fork changes;
          # --empty=drop skips upstream commits that become empty. Rebase
          # stops on modify/delete and rename/delete conflicts, which -X ours
          # cannot auto-resolve, so resolve those in the fork's favor too:
          # keep the fork's file when it still exists, keep the deletion when
          # the fork removed it. Then continue until the rebase completes.
          if ! git rebase -X ours --empty=drop master; then
            # A rebase that stops on conflicts can leave a stale
            # .git/index.lock behind (seen on runner git 2.54); we are the
            # only git process here, so a lock at this point is stale.
            rm -f .git/index.lock
            while [ -n "$(git diff --name-only --diff-filter=U)" ]; do
              while IFS= read -r -d '' f; do
                if git cat-file -e "HEAD:$f" 2>/dev/null; then
                  # The fork still has this file: keep the fork's version.
                  git checkout --ours -- "$f"
                else
                  # The fork deleted this file: keep the deletion.
                  git rm -f --ignore-unmatch -- "$f"
                fi
                git add -- "$f"
              done < <(git diff --name-only --diff-filter=U -z)
              rm -f .git/index.lock
              GIT_EDITOR=true git rebase --continue || {
                rm -f .git/index.lock
                GIT_EDITOR=true git rebase --continue
              }
            done
          fi
          # Never push a half-rebased branch: if the rebase is still in
          # progress, fail the step instead of pushing fork-deleting diffs.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "rebase did not complete; refusing to push sync/upstream-master" >&2
            exit 1
          fi
          git push -f origin sync/upstream-master

      - name: Open or update the sync PR
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="Automated sync of upstream \`deepseek-ai/deepseek-harness\` master into this fork.

          - Head: \`sync/upstream-master\` (upstream master rebased onto fork master; conflicting hunks resolved in the fork's favor).
          - Reviewed by \`upstream-review.yml\` (LLM verdict + sanity gates) before any auto-merge.
          - Review the diff, then merge when it looks safe — or let the review workflow merge it automatically.
          - Deploys are never performed by this automation."
          PR=$(gh pr list --head sync/upstream-master --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base master --head sync/upstream-master \
              --title 'chore(sync): merge upstream changes' --body "$BODY"
          else
            gh pr edit "$PR" --body "$BODY"
          fi
