# Merge upstream into a reviewable branch; unresolved conflicts stop the run.
# Preserve fork workflows and rescope newly introduced DSH packages.
# No deployment is performed.

name: upstream-sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master

      - name: Count new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count master..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream commits not yet in this fork: $BEHIND"

      - name: Setup pnpm (for lockfile regeneration)
        if: steps.check.outputs.behind != '0'
        uses: pnpm/action-setup@v4
        # No explicit version: the repo's package.json `packageManager` field
        # selects the version (pnpm@11.7.0).
      - uses: actions/setup-node@v4
        if: steps.check.outputs.behind != '0'
        with:
          node-version: 22

      - name: Rebuild the sync branch without discarding conflicts
        if: steps.check.outputs.behind != '0'
        run: |
          set -euo pipefail
          git config user.name 'dsh-sync[bot]'
          git config user.email 'dsh-sync[bot]@users.noreply.github.com'
          LEASE=$(git ls-remote origin refs/heads/sync/upstream-master | cut -f1)
          git checkout -B sync/upstream-master master
          if ! git merge --no-commit --no-ff upstream/master; then
            echo 'Upstream requires manual integration; conflicting paths:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          # GITHUB_TOKEN cannot update workflow files. Keep the reviewed fork copies.
          git restore --source=master --staged --worktree -- .github/workflows
          # New upstream packages must use the fork namespace before resolution.
          node --experimental-strip-types scripts/rescope-dsh.ts --apply
          pnpm install --no-frozen-lockfile --lockfile-only --ignore-scripts
          git add -A
          git commit -m 'chore(sync): integrate upstream and preserve fork namespace'
          git merge-base --is-ancestor upstream/master HEAD
          git push --force-with-lease=refs/heads/sync/upstream-master:"$LEASE" origin HEAD:refs/heads/sync/upstream-master

      - name: Open or update the sync PR
        if: steps.check.outputs.behind != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="Automated sync of upstream \`deepseek-ai/deepseek-harness\` master into this fork.

          - Head: \`sync/upstream-master\` (upstream master merged onto fork master; conflicts require manual integration; new packages use the fork namespace).
          - Reviewed by \`upstream-review.yml\` (LLM verdict + sanity gates) before any auto-merge.
          - Review the diff, then merge when it looks safe — or let the review workflow merge it automatically.
          - Deploys are never performed by this automation."
          PR=$(gh pr list --head sync/upstream-master --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            # The fork keeps an existing sync PR open; GITHUB_TOKEN cannot
            # see/create PRs while the repo setting "Allow GitHub Actions to
            # create and approve pull requests" is off, so creation may fail
            # (continue-on-error). The pushed branch still triggers
            # upstream-review on the existing PR via synchronize events.
            gh pr create --base master --head sync/upstream-master \
              --title 'chore(sync): merge upstream changes' --body "$BODY"
          else
            gh pr edit "$PR" --body "$BODY"
          fi
