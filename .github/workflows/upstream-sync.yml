# Upstream sync: pull every change from deepseek-ai/deepseek-harness master
# into this fork as a reviewable PR.
#
# - Runs hourly (and on manual dispatch).
# - Creates/updates branch `sync/upstream-master` = fork master merged with
#   upstream master; on conflict OUR (fork) version wins, so the fork's own
#   changes are never silently overwritten by upstream.
# - A single `git merge -X ours` is used instead of a 337-commit rebase: same
#   resulting tree, but no sequencer machinery (a conflicted rebase on runner
#   git 2.54 leaves a stale .git/index.lock that kills every later git call).
#   `-X ours` covers content conflicts; modify/delete + rename/delete
#   conflicts are also resolved in the fork's favor: keep the fork's file
#   when it still exists, keep the deletion when the fork removed it.
# - The fork keeps its own .github/workflows/* files: upstream's workflow
#   changes are dropped from the sync branch, because GITHUB_TOKEN (a GitHub
#   App) cannot push workflow-file changes (the `workflows` scope is not
#   grantable in workflow syntax) — pushing them would be rejected.
# - Opens (or updates) a PR sync/upstream-master -> master. The companion
#   workflow `upstream-review.yml` reviews that PR with an LLM and merges it
#   only when the review and the sanity gates approve.
#
# No deployment is ever performed by this automation.

name: upstream-sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master

      - name: Count new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count master..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream commits not yet in this fork: $BEHIND"

      - name: Rebuild the sync branch (conflicts resolve in our favor)
        if: steps.check.outputs.behind != '0'
        run: |
          set -euo pipefail
          git config user.name 'dsh-sync[bot]'
          git config user.email 'dsh-sync[bot]@users.noreply.github.com'
          git checkout -B sync/upstream-master master
          # Merge upstream master onto fork master. -X ours keeps the fork's
          # version of any hunk that conflicts with fork changes; a single
          # merge is used instead of a long rebase (a conflicted rebase on
          # runner git 2.54 leaves a stale .git/index.lock that kills later
          # git calls). We are the only git process here, so any lock found
          # at these points is stale and safe to clear.
          rm -f .git/index.lock
          if ! git merge -X ours --no-edit upstream/master; then
            rm -f .git/index.lock
            if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
              # No unresolved conflicts, yet the merge failed: a stale lock
              # prevented it from writing its conflicted index. Roll back
              # and retry once; never commit a partial merge.
              echo "merge failed with no unresolved conflicts; rolling back and retrying" >&2
              git merge --abort 2>/dev/null || true
              rm -f .git/index.lock
              git merge -X ours --no-edit upstream/master || { echo "merge failed again; aborting" >&2; exit 1; }
            fi
          fi
          # Resolve modify/delete + rename/delete conflicts (which -X ours
          # cannot auto-resolve) in the fork's favor: keep the fork's file
          # when it still exists, keep the deletion when the fork removed it.
          while [ -n "$(git diff --name-only --diff-filter=U)" ]; do
            rm -f .git/index.lock
            while IFS= read -r -d '' f; do
              if git cat-file -e "HEAD:$f" 2>/dev/null; then
                # The fork still has this file: keep the fork's version.
                git checkout --ours -- "$f"
              else
                # The fork deleted this file: keep the deletion.
                git rm -f --ignore-unmatch -- "$f"
              fi
              git add -- "$f"
            done < <(git diff --name-only --diff-filter=U -z)
            rm -f .git/index.lock
          done
          # The fork keeps its own workflow files: GITHUB_TOKEN is a GitHub
          # App and cannot push .github/workflows/* changes (the `workflows`
          # scope is not grantable in workflow syntax), so drop upstream's
          # workflow-file changes from the sync branch entirely.
          git rm -r --cached --quiet -- .github/workflows 2>/dev/null || true
          git checkout master -- .github/workflows
          if [ -f .git/MERGE_HEAD ]; then
            # Resolved-conflict merge: the commit below includes the
            # workflow-file exclusion.
            git commit --no-edit || { rm -f .git/index.lock; git commit --no-edit; }
          elif ! git diff --cached --quiet -- .github/workflows; then
            # The merge auto-committed (no conflicts); the exclusion needs
            # its own commit.
            git commit -m "chore(sync): keep fork-owned workflow files"
          fi
          # Never push a half-merged or corrupted result: upstream is ahead
          # of the fork (behind != 0), so the merge result MUST differ from
          # fork master. Equal trees mean upstream changes were silently
          # dropped (e.g. by a failed index write) — fail instead.
          if [ -f .git/MERGE_HEAD ] || [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse master^{tree})" ]; then
            echo "merge did not complete; refusing to push sync/upstream-master" >&2
            exit 1
          fi
          git push -f origin sync/upstream-master

      - name: Open or update the sync PR
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="Automated sync of upstream \`deepseek-ai/deepseek-harness\` master into this fork.

          - Head: \`sync/upstream-master\` (upstream master merged onto fork master; conflicting hunks resolved in the fork's favor).
          - Reviewed by \`upstream-review.yml\` (LLM verdict + sanity gates) before any auto-merge.
          - Review the diff, then merge when it looks safe — or let the review workflow merge it automatically.
          - Deploys are never performed by this automation."
          PR=$(gh pr list --head sync/upstream-master --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base master --head sync/upstream-master \
              --title 'chore(sync): merge upstream changes' --body "$BODY"
          else
            gh pr edit "$PR" --body "$BODY"
          fi
