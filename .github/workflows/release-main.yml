name: Publish main to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release:
    if: github.repository == 'knyazev741/deepseek-harness' && github.ref == 'refs/heads/main'
    name: Publish verified CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install workspace tools
        run: pnpm install --frozen-lockfile

      - name: Test release tooling
        run: pnpm exec vitest run scripts/release

      - name: Reserve a release version on main
        id: version
        run: |
          pnpm run release:assert-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version=$(pnpm --silent run release:next-main-version)
          pnpm run release:dsh "$version"
          git push origin HEAD:main
          git tag "dsh-v$version"
          git push origin "refs/tags/dsh-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify current remote source before build
        run: pnpm run release:assert-main

      - name: Build release and check aggregate types
        run: pnpm run build:official

      - name: Check package dependencies and published exports
        run: |
          pnpm run verify-package-dependencies
          pnpm run publint
          pnpm run verify-node-next-types

      - name: Verify release version and pack
        run: |
          pnpm run release:verify --family dsh
          pnpm run release:pack --family dsh --out dist/npm --concurrency 8
          pnpm run release:pack-entry --from dist/npm --out dist/npm-entry

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Install only the packed CLI and boot Web
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run release:smoke-web --version "$RELEASE_VERSION" --from dist/npm-entry --evidence dist/npm-smoke/packed-node24

      - name: Verify current remote source before publication
        run: pnpm run release:assert-main

      - name: Publish the immutable CLI candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run release:publish --family dsh --from dist/npm-entry --dist-tag "candidate-$RELEASE_VERSION"

      - name: Wait for public metadata and downloads after npm scanning
        run: pnpm run release:wait-public --from dist/npm-entry

      - name: Install the public candidate and boot Web on Node 24
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run release:smoke-web --version "$RELEASE_VERSION" --evidence dist/npm-smoke/public-node24

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.3'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the public candidate and boot Web on Node 22
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run release:smoke-web --version "$RELEASE_VERSION" --evidence dist/npm-smoke/public-node22

      - name: Promote the verified CLI to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:promote --from dist/npm-entry

      - name: Report the public release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          echo "Published @knyazevai/dsh@$RELEASE_VERSION from $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Run: npx @knyazevai/dsh web' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: npm-main-${{ steps.version.outputs.version || github.run_id }}
          path: |
            dist/npm
            dist/npm-entry
            dist/npm-smoke
          if-no-files-found: ignore
          retention-days: 7

  modules:
    if: github.repository == 'knyazev741/deepseek-harness' && github.ref == 'refs/heads/main'
    name: Publish modular packages
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: npm-publish
    permissions:
      contents: read
    concurrency:
      group: Release-modular-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install publisher tools without package scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-main-${{ needs.release.outputs.version }}
          path: dist

      - name: Verify current remote source before modular publication
        run: pnpm run release:assert-main

      - name: Publish immutable modular candidates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: pnpm run release:publish --family dsh --from dist/npm --dist-tag "candidate-$RELEASE_VERSION"

      - name: Wait for public modular metadata and downloads
        run: pnpm run release:wait-public --from dist/npm

      - name: Promote modular packages without changing the CLI tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:promote --from dist/npm --skip-cli
