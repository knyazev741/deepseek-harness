name: Publish main to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  npm-auth:
    if: github.repository == 'knyazev741/deepseek-harness' && github.ref == 'refs/heads/main'
    name: Verify npm publishing identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the repository publishing credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm_publisher=$(npm whoami)
          test "$npm_publisher" = knyazevai
          echo "npm publishing identity verified: $npm_publisher"

  windows-proxy:
    if: github.repository == 'knyazev741/deepseek-harness' && github.ref == 'refs/heads/main'
    name: Verify Windows proxy support
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check proxy routing and the native Windows settings reader
        run: pnpm exec vitest run packages/util/http-proxy/tests

  release:
    if: github.repository == 'knyazev741/deepseek-harness' && github.ref == 'refs/heads/main'
    name: Publish verified CLI
    needs: [windows-proxy, npm-auth]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install workspace tools
        run: pnpm install --frozen-lockfile

      - name: Test release tooling
        run: pnpm exec vitest run scripts/release

      - name: Verify fork package scopes
        run: pnpm run rescope-dsh:check

      - name: Reserve a release version on main
        id: version
        run: |
          pnpm run release:assert-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version=$(pnpm --silent run release:next-main-version)
          pnpm run release:dsh "$version"
          git push origin HEAD:main
          git tag "dsh-v$version"
          git push origin "refs/tags/dsh-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify current remote source before build
        run: pnpm run release:assert-main

      - name: Build release and check aggregate types
        run: pnpm run build:official

      - name: Check package dependencies and published exports
        run: |
          pnpm run verify-package-dependencies
          pnpm run publint
          pnpm run verify-node-next-types

      - name: Verify release version and pack
        run: |
          pnpm run release:verify --family dsh
          pnpm run release:pack --family dsh --out dist/npm --concurrency 8
          pnpm run release:pack --family vendor --out dist/npm-vendor --concurrency 8
          pnpm run release:pack-entry --from dist/npm --vendor-from dist/npm-vendor --out dist/npm-entry

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Install only the packed CLI and boot Web
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run release:smoke-web --version "$RELEASE_VERSION" --from dist/npm-entry --evidence dist/npm-smoke/packed-node24

      - name: Verify current remote source before publication
        run: pnpm run release:assert-main

      - name: Publish the immutable CLI candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run release:publish --family dsh --from dist/npm-entry --dist-tag "candidate-$RELEASE_VERSION"

      - name: Wait for public metadata and downloads after npm scanning
        run: pnpm run release:wait-public --from dist/npm-entry

      - name: Install the public candidate and boot Web on Node 24
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run release:smoke-web --version "$RELEASE_VERSION" --evidence dist/npm-smoke/public-node24

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.9.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the public candidate and boot Web on minimum Node 24.9
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm run release:smoke-web --version "$RELEASE_VERSION" --evidence dist/npm-smoke/public-node24-minimum

      - name: Promote the verified CLI to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:promote --from dist/npm-entry

      - name: Report the public release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          echo "Published @knyazevai/dsh@$RELEASE_VERSION from $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Run: npx @knyazevai/dsh web' >> "$GITHUB_STEP_SUMMARY"
          echo 'Standalone plugin publication uses the manual Release publish (dsh) workflow with signed native artifacts.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: npm-main-${{ steps.version.outputs.version || github.run_id }}
          path: |
            dist/npm
            dist/npm-entry
            dist/npm-vendor
            dist/npm-smoke
          if-no-files-found: ignore
          retention-days: 7
