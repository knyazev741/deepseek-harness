# The dsh-fork-base bundle is an insert-only Host overlay applied after
# dsh-base. Each row belongs to an independently removable fork package, so a
# profile or a later --patch layer can disable or reconfigure it by id without
# replacing any upstream row.

- insert:
    # Session provenance is enabled by the deployment environment, not by a
    # session-header field. The package records the marker only when this
    # variable has the exact value `true`.
    - id: fork-session-source
      name: '@deepseek-ai/dsh-fork-session-source'
      config:
        enabledWhenEnv: GITHUB_ACTIONS

    # Workspace membership is supplied by the Web Host layer. Keeping this
    # row in the fork bundle lets that layer consume one stable Host overlay;
    # Loader activation waits for the required workspaceRegistry service.
    - id: fork-workspace-session-state
      name: '@deepseek-ai/dsh-fork-workspace-session-state'

    # Bound only the idle time before the first LLM stream result. The explicit
    # value keeps the deployment policy visible and patchable at this layer.
    - id: fork-llm-first-chunk-timeout
      name: '@deepseek-ai/dsh-fork-llm-first-chunk-timeout'
      config:
        firstChunkIdleTimeoutMs: 120000
