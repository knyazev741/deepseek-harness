# The Notion grant lives in the credential store, which the headless profile disables.
- id: credentials
  disabled: false

- insert:
    - id: mcp-manager
      name: '@knyazevai/dsh-mcp-manager'
      inject: [credentials, mcpResources]
    - id: notion
      name: '@knyazevai/dsh-notion'
      config:
        url: !!js process.env.DSH_MCP_DEMO_URL
