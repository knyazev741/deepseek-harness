# Keyless overflow recovery followed by first-chunk retries and cooldown.

- id: llm-deepseek
  name: '@knyazevai/dsh-llm-deepseek'
  disabled: true

- id: session-persistence-jsonl
  name: '@knyazevai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@knyazevai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.99
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: fork-llm-first-chunk-timeout
      name: '@knyazevai/dsh-fork-llm-first-chunk-timeout'

    - id: fork-llm-rate-limit-cooldown
      name: '@knyazevai/dsh-fork-llm-rate-limit-cooldown'
      config:
        cooldownMs: 1
        retryableCodes: [FIRST_CHUNK_TIMEOUT]

    - id: llm-replay
      name: '@knyazevai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            retryPolicy:
              mode: normal
              maxRetries: 20
              retryableCodes: [FIRST_CHUNK_TIMEOUT]
              backoff:
                initialDelayMs: 1
                maxDelayMs: 1
                jitterRatio: 0
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000
