# Opt-in Wake Scheduler patch over any dsh profile. The shipped composition
# stays unchanged; mounting this row gives every root session created after
# load the wake_schedule_set / wake_schedule_status / wake_schedule_cancel
# tools, so the agent can put its own conversation on a timer.
#
#   dsh web --patch apps/cli/config/examples/wake-scheduler/cordis.yml
#
# `enabled: false` is the shipped default: no session is scheduled until the
# agent sets one. Set `enabled: true` to additionally seed a fallback schedule
# for sessions that have none; an agent-set or cancelled schedule always wins
# over that fallback.

- insert:
    - id: wake-scheduler
      name: '@knyazevai/dsh-wake-scheduler'
      config:
        enabled: false
        # Fallback-only fields, ignored while `enabled` is false:
        # intervalMinutes: 30
        # prompt: 'Scheduled check-in: continue the plan and report anything that needs my decision.'
        # sessionId: session-00000000-0000-0000-0000-000000000000
        # startDelayMinutes: 30
