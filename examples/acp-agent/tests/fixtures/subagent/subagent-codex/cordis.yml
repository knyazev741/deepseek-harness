# Test-only composition of the Bundle-supplied default and two named Codex instances.
# The owning e2e applies the package's real patch and never invokes the model or Codex.
- id: fixture
  name: './fixture.ts'

- id: subagent
  name: '@knyazevai/dsh-subagent'

- id: subprocess
  name: '@knyazevai/dsh-subprocess-local'

- id: subagent-codex-primary
  name: '@knyazevai/dsh-subagent-codex'
  config:
    providerName: codex-primary

- id: subagent-codex-secondary
  name: '@knyazevai/dsh-subagent-codex'
  config:
    providerName: codex-secondary

- id: tool-subagent-codex
  name: '@knyazevai/dsh-tool-subagent'
  config:
    provider: codex
    toolName: subagent_codex
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: tool-subagent-codex-primary
  name: '@knyazevai/dsh-tool-subagent'
  config:
    provider: codex-primary
    toolName: subagent_codex_primary
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: tool-subagent-codex-secondary
  name: '@knyazevai/dsh-tool-subagent'
  config:
    provider: codex-secondary
    toolName: subagent_codex_secondary
    backgroundMode: one-shot
    maxDepth: 'provider-managed'

- id: agent-spine
  name: '@knyazevai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()
    persona: 'This composition test must not start a model turn.'
    workspaceContext: false

- id: persistence
  name: '@knyazevai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'

- id: checkpoint-policy
  name: '@knyazevai/dsh-session-checkpoint-policy'
