# Keyless context-overflow composition for the assembled compaction snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@knyazevai/dsh-llm-deepseek'
        disabled: true
      - id: compaction-basic
        name: '@knyazevai/dsh-compaction-basic'
        config:
          thresholdRatio: 0.99
          retainTokens: 20
          maxTokens: 32
          summarizerCooldownMs: 1
      - insert:
          - id: llm-replay
            name: '@knyazevai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  retryPolicy:
                    mode: normal
                    maxRetries: 1
                    retryableCodes:
                      - RATE_LIMIT
                    backoff:
                      initialDelayMs: 1
                      maxDelayMs: 1
                      jitterRatio: 0
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
